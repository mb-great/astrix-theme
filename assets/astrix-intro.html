<!--
  ASTRIX MEDIA — Cinematic Logo Animation (built on the real brand mark)
  Single self-contained file. No external dependencies. The logo is embedded.

  HOW IT WORKS
  ------------
  Particles assemble into the EXACT silhouette of your logo (target points are
  sampled from the embedded image), then the crisp logo resolves in with a
  terracotta glow and a light-sweep masked to the mark's shape, followed by the
  wordmark + tagline reveal.

  HOW TO USE
  ----------
  1. Embed as a full-screen intro/preloader, or place #astrix-stage in a container.
  2. Replace the logo: set CONFIG.LOGO_SRC to a new URL/data-URI (the current value
     is your supplied mark, embedded as a transparent PNG).
  3. Fire your site reveal when the intro ends:
        window.AstrixIntro.onComplete = () => { /* show your site */ };
     or:  window.addEventListener('astrix-intro-complete', fn);
  4. Play once per session (production): see CONFIG.PLAY_ONCE_PER_SESSION note.
  5. Review panel: ?debug=1 in the URL, or press "P". Set CONFIG.ENABLE_PANEL=false
     for production.

  All tunable values live in CONFIG at the top of <script>.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrix Media</title>
<style>
  :root{
    --bg:        #0a0805;
    --bg-2:      #161009;
    --terra:     #c06830;
    --terra-lo:  #8f4a20;
    --cream:     #f3e7da;
    --cream-dim: #b9a892;
    --grain:     0.045;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(125% 90% at 50% 40%, var(--bg-2) 0%, var(--bg) 60%, #050402 100%);
    color:var(--cream);
    font-family:"Helvetica Neue","Segoe UI",system-ui,sans-serif;
    overflow:hidden;
  }
  #astrix-stage{position:fixed; inset:0; isolation:isolate}

  #fx{position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1}

  /* the real logo + its light-sweep, positioned by JS */
  .markwrap{
    position:absolute; z-index:2; left:50%; top:42%;
    transform:translate(-50%,-50%);
    opacity:0;
  }
  .markwrap.show{opacity:1; transition:opacity .65s ease}
  .markwrap.lit #logo-img{ animation:glowPulse 1.5s ease-out forwards; }
  #logo-img{
    display:block; width:100%; height:100%;
    filter:drop-shadow(0 0 14px rgba(192,104,48,.0));
  }
  @keyframes glowPulse{
    0%{filter:drop-shadow(0 0 6px rgba(192,104,48,0))}
    35%{filter:drop-shadow(0 0 34px rgba(214,120,58,.85))}
    100%{filter:drop-shadow(0 0 16px rgba(192,104,48,.42))}
  }
  /* light sweep: a moving highlight masked to the logo's exact shape */
  .sweep{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    background:linear-gradient(105deg,
      transparent 38%, rgba(255,240,225,.0) 44%,
      rgba(255,244,232,.95) 50%, rgba(255,240,225,.0) 56%, transparent 62%);
    background-size:280% 100%; background-position:130% 0;
    mix-blend-mode:screen;
  }
  .markwrap.lit .sweep{ opacity:1; animation:sweepMove .85s cubic-bezier(.4,0,.2,1) forwards; animation-delay:.35s; }
  @keyframes sweepMove{ from{background-position:130% 0} to{background-position:-60% 0} }

  /* overlays */
  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(132% 100% at 50% 42%, transparent 36%, rgba(8,5,2,.55) 76%, rgba(0,0,0,.94) 100%);
    opacity:0; transition:opacity 1s ease;
  }
  .grain{
    position:absolute; inset:-50%; pointer-events:none; z-index:4;
    opacity:var(--grain); background-image:var(--grain-img); background-size:170px 170px;
    mix-blend-mode:overlay; animation:grainShift 1.1s steps(6) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)} 20%{transform:translate(-6%,4%)}
    40%{transform:translate(5%,-7%)} 60%{transform:translate(-4%,6%)}
    80%{transform:translate(7%,3%)} 100%{transform:translate(0,0)}
  }

  /* wordmark + tagline */
  .lockup{position:absolute; left:0; right:0; z-index:5; text-align:center; pointer-events:none}
  .wordmark{
    position:relative; display:inline-block;
    font-weight:300; font-size:clamp(26px,5.6vw,52px);
    letter-spacing:.46em; text-indent:.46em; color:var(--cream); line-height:1;
    clip-path:inset(0 100% 0 0); opacity:0;
  }
  .wordmark::after{
    content:""; position:absolute; top:-12%; bottom:-12%; width:12%; left:-22%;
    background:linear-gradient(90deg,transparent,rgba(243,231,218,.9),transparent);
    filter:blur(2px); opacity:0; pointer-events:none;
  }
  .play .wordmark{ animation:wordReveal 1.05s cubic-bezier(.16,1,.3,1) forwards; animation-delay:var(--word-delay) }
  .play .wordmark::after{ animation:wordEdge 1.05s ease-out forwards; animation-delay:var(--word-delay) }
  @keyframes wordReveal{
    0%{clip-path:inset(0 100% 0 0); opacity:0; filter:blur(6px)}
    18%{opacity:1} 100%{clip-path:inset(0 0 0 0); opacity:1; filter:blur(0)}
  }
  @keyframes wordEdge{ 0%{left:-22%;opacity:0} 14%{opacity:.95} 100%{left:108%;opacity:0} }

  .tagline{
    margin-top:1.45em; font-family:Georgia,"Times New Roman",serif; font-style:italic;
    font-size:clamp(12px,2vw,17px); letter-spacing:.09em; color:var(--cream-dim);
    opacity:0; transform:translateY(8px);
  }
  .play .tagline{ animation:fadeUp 1s ease forwards; animation-delay:var(--tag-delay) }
  @keyframes fadeUp{ to{opacity:1; transform:translateY(0)} }
  .rule{margin:1.35em auto 0; height:1px; width:0; opacity:0;
    background:linear-gradient(90deg,transparent,var(--terra),transparent)}
  .play .rule{ animation:ruleGrow 1s cubic-bezier(.16,1,.3,1) forwards; animation-delay:calc(var(--tag-delay) + .15s) }
  @keyframes ruleGrow{ to{width:min(56%,340px); opacity:.9} }

  /* review panel */
  #panel{position:fixed; right:14px; bottom:14px; z-index:20;
    background:rgba(16,11,6,.85); backdrop-filter:blur(8px);
    border:1px solid rgba(192,104,48,.3); border-radius:12px; padding:12px 14px;
    font-size:12px; color:var(--cream-dim); display:none; min-width:188px;
    box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #panel.show{display:block}
  #panel h4{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--cream); margin-bottom:10px; font-weight:600}
  #panel label{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0}
  #panel input[type=range]{width:96px; accent-color:var(--terra)}
  #panel button{width:100%; margin-top:8px; padding:8px; cursor:pointer;
    background:linear-gradient(180deg,var(--terra),var(--terra-lo)); color:#fff;
    border:0; border-radius:8px; font-size:12px; letter-spacing:.06em; font-weight:600}
  #panel button:active{transform:translateY(1px)}
  .hint{position:fixed; left:14px; bottom:12px; z-index:20; font-size:10px;
    letter-spacing:.14em; color:rgba(185,168,146,.4); text-transform:uppercase; user-select:none}
  @media (prefers-reduced-motion: reduce){ .grain{animation:none} }
</style>
</head>
<body>
  <div id="astrix-stage">
    <canvas id="fx"></canvas>
    <div class="markwrap">
      <img id="logo-img" alt="Astrix Media">
      <div class="sweep"></div>
    </div>
    <div class="lockup">
      <div class="wordmark">ASTRIX&nbsp;MEDIA</div>
      <div class="tagline">Where Strategy Meets Story</div>
      <div class="rule"></div>
    </div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div id="panel">
    <h4>Astrix Intro — Review</h4>
    <label>Speed <input id="p-speed" type="range" min="0.4" max="2" step="0.1" value="1"></label>
    <label>Grain <input id="p-grain" type="checkbox" checked></label>
    <label>Glow <input id="p-glow" type="checkbox" checked></label>
    <button id="p-replay">Replay</button>
  </div>
  <div class="hint" id="hint">press P for controls</div>

/* ============================ SETUP ============================ */
const stage  = document.getElementById('astrix-stage');
const canvas = document.getElementById('fx');
const ctx    = canvas.getContext('2d');
const markwrap = document.querySelector('.markwrap');
const logoImg  = document.getElementById('logo-img');
const sweepEl  = document.querySelector('.sweep');
const lockup   = document.querySelector('.lockup');
const vignette = document.querySelector('.vignette');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let DPR=1,W=0,H=0,cx=0,cy=0;
let dispW=0,dispH=0;            // on-screen logo size (px)
let logoAspect=1;
let normTargets=[];            // sampled silhouette points, normalized 0..1
let particles=[];
let speed=1, useGlow=true;
let startT=0, raf=0, finished=false, ready=false;

/* film grain */
(function buildGrain(){
  const g=document.createElement('canvas'); g.width=g.height=170;
  const gx=g.getContext('2d'); const id=gx.createImageData(170,170);
  for(let i=0;i<id.data.length;i+=4){ const v=Math.random()*255|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  gx.putImageData(id,0,0);
  document.documentElement.style.setProperty('--grain-img',`url(${g.toDataURL()})`);
})();

const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const clamp01=x=>x<0?0:x>1?1:x;

/* sample silhouette target points from the loaded logo image */
function sampleLogo(img){
  const sh=200, sw=Math.round(sh*(img.width/img.height));
  logoAspect=img.width/img.height;
  const oc=document.createElement('canvas'); oc.width=sw; oc.height=sh;
  const o=oc.getContext('2d'); o.drawImage(img,0,0,sw,sh);
  const d=o.getImageData(0,0,sw,sh).data;
  const filled=[];
  for(let y=0;y<sh;y+=1) for(let x=0;x<sw;x+=1){
    if(d[(y*sw+x)*4+3]>40) filled.push([x/sw, y/sh]);
  }
  // pick PARTICLES random target points from the filled area
  normTargets=[];
  for(let i=0;i<CONFIG.PARTICLES;i++) normTargets.push(filled[(Math.random()*filled.length)|0]);
}

function makeParticles(){
  particles = normTargets.map(()=>{
    const ang=Math.random()*Math.PI*2, dist=Math.max(W,H)*(0.5+Math.random()*0.55);
    return { sx:cx+Math.cos(ang)*dist, sy:cy+Math.sin(ang)*dist,
      delay:Math.random()*0.5, dur:0.85+Math.random()*0.5,
      size:1+Math.random()*1.9, spark:Math.random()<0.32 };
  });
}

function layout(){
  cx=W/2; cy=H*0.42;
  dispH=Math.min(W,H)*CONFIG.MARK_FRACTION;
  dispW=dispH*logoAspect;
  markwrap.style.width=dispW+'px'; markwrap.style.height=dispH+'px';
  markwrap.style.left=cx+'px'; markwrap.style.top=cy+'px';
  lockup.style.top=(cy+dispH/2+Math.min(W,H)*0.06)+'px';
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); makeParticles();
}

/* map a normalized silhouette point to current viewport pixels */
function targetXY(n){
  return [ cx-dispW/2 + n[0]*dispW, cy-dispH/2 + n[1]*dispH ];
}

/* ============================ TIMELINE ============================ */
function frame(now){
  if(!startT) startT=now;
  const t=((now-startT)/1000)*speed;
  ctx.clearRect(0,0,W,H);
  const aDur=CONFIG.ASSEMBLE_END-CONFIG.ASSEMBLE_START;
  const solid=clamp01((t-CONFIG.ASSEMBLE_END)/0.45);   // particles dissolve as logo arrives

  for(let i=0;i<particles.length;i++){
    const p=particles[i]; const tgt=targetXY(normTargets[i]);
    const lt=clamp01((t-CONFIG.ASSEMBLE_START - p.delay*aDur)/p.dur);
    const e=easeOutExpo(lt);
    const x=p.sx+(tgt[0]-p.sx)*e, y=p.sy+(tgt[1]-p.sy)*e;
    const pa=(0.3+0.7*lt)*(1-solid*0.9);
    if(pa<=0) continue;
    ctx.save();
    ctx.globalAlpha=pa;
    ctx.fillStyle=p.spark?CONFIG.SPARK_COLOR:CONFIG.PARTICLE_COLOR;
    if(useGlow){ ctx.shadowColor=CONFIG.GLOW; ctx.shadowBlur=p.spark?12:7; }
    ctx.beginPath(); ctx.arc(x,y,p.size*(0.55+0.45*e),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if(t>=CONFIG.END && !finished) complete();
  if(!finished) raf=requestAnimationFrame(frame);
}

function complete(){
  finished=true;
  if(window.AstrixIntro.onComplete){ try{ window.AstrixIntro.onComplete(); }catch(e){} }
  window.dispatchEvent(new CustomEvent('astrix-intro-complete'));
  window.parent.postMessage('introComplete', '*');
}

/* ============================ CONTROL ============================ */
function reset(){
  cancelAnimationFrame(raf); finished=false; startT=0;
  stage.classList.remove('play');
  markwrap.classList.remove('show','lit');
  vignette.style.opacity='0';
  void stage.offsetWidth;
}
function play(){
  reset();
  lockup.style.setProperty('--word-delay',(CONFIG.WORD_DELAY/speed)+'s');
  lockup.style.setProperty('--tag-delay',(CONFIG.TAG_DELAY/speed)+'s');
  requestAnimationFrame(()=>{
    stage.classList.add('play'); vignette.style.opacity='1';
    setTimeout(()=>{ markwrap.classList.add('show');
      requestAnimationFrame(()=>markwrap.classList.add('lit')); },
      (CONFIG.SOLIDIFY/speed)*1000);
    raf=requestAnimationFrame(frame);
  });
}
function reducedPlay(){
  stage.classList.add('play'); vignette.style.opacity='1';
  markwrap.classList.add('show');
  lockup.style.setProperty('--word-delay','.15s');
  lockup.style.setProperty('--tag-delay','.55s');
  setTimeout(complete,1500);
}
function maybePlay(){
  if(!ready) return;
  if(CONFIG.PLAY_ONCE_PER_SESSION){
    // try{ if(sessionStorage.getItem('astrixIntroSeen')){ complete(); return; } }catch(e){}
  }
  reduceMotion ? reducedPlay() : play();
}
// function markPlayed(){ try{ sessionStorage.setItem('astrixIntroSeen','1'); }catch(e){} }

window.AstrixIntro = { onComplete:null, replay:()=>maybePlay() };

/* review panel */
(function panelSetup(){
  const panel=document.getElementById('panel'), hint=document.getElementById('hint');
  if(!CONFIG.ENABLE_PANEL){ hint.style.display='none'; return; }
  if(new URLSearchParams(location.search).get('debug')==='1') panel.classList.add('show');
  addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='p') panel.classList.toggle('show'); });
  document.getElementById('p-speed').addEventListener('input',e=>speed=parseFloat(e.target.value));
  document.getElementById('p-grain').addEventListener('change',e=>{
    document.querySelector('.grain').style.opacity=e.target.checked
      ? getComputedStyle(document.documentElement).getPropertyValue('--grain') : '0'; });
  document.getElementById('p-glow').addEventListener('change',e=>useGlow=e.target.checked);
  document.getElementById('p-replay').addEventListener('click',()=>maybePlay());
})();

/* boot — wait for the logo to load so we can sample its silhouette + mask the sweep */
addEventListener('resize',()=>{ if(ready) resize(); });
const img=new Image();
img.onload=()=>{
  logoImg.src=CONFIG.LOGO_SRC;
  sweepEl.style.webkitMaskImage=`url(${CONFIG.LOGO_SRC})`;
  sweepEl.style.maskImage=`url(${CONFIG.LOGO_SRC})`;
  sampleLogo(img); ready=true; resize(); maybePlay();
};
img.onerror=()=>{ ready=true; resize(); reducedPlay(); };
img.src=CONFIG.LOGO_SRC;
</script>
</body>
</html>
